/torso_front_rgbd_camera:
  use_preset: "d435_rgbd_high_accuracy.yaml"
  use_if:
    robot_type: ari
    torso_front_camera_model: realsense-d435
  ros__parameters:
    camera_name: "torso_front_rgbd_camera"
    serial_no: "${serial_number_camera_0}"

/torso_back_stereo_camera:
  use_preset: "t265_stereo_camera.yaml"
  use_if:
    robot_type: ari
  ros__parameters:
    camera_name: "torso_back_stereo_camera"
    serial_no: "${serial_number_camera_1}"